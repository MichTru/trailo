<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="assets/trailo-simbolo.png">
<link rel="preload" as="image" href="assets/trailo-simbolo.png"><link rel="preload" as="image" href="assets/trailo-wordmark.png">
<title>Trailo 2.0 · prototipo</title>
<meta name="theme-color" content="#F5F2EB">
<meta name="description" content="Prototipo navigabile di Trailo 2.0: percorsi, registrazione e progressi per ciclismo e running.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
/* TRAILO 2.0 · prototipo rev. 3
   Tre esperienze, un marchio:
   - Home e Progressi su carta chiara (il wordmark originale è nero: resta fedele senza inversioni)
   - Percorsi costruito attorno a immagini grandi e alla carta del territorio
   - Attività su fondo notte, solo numeri e stato */
:root{
  --paper:#F5F2EB; --paper2:#ECE6DA; --card:#FFFFFF; --hair:rgba(20,26,34,.12); --hair2:rgba(20,26,34,.2);
  --ink:#141A22; --ink2:#3E4652; --ink3:#5C6370;
  --tq:#00CFC8; --tq-t:#00706C; --blue:#0789B4; --blue-t:#06688A; --or:#FF6A2E; --or-t:#B3430F;
  --ok:#1D7A52; --warn:#9A6408; --crit:#B4380C;
  --night:#05090F; --m1:#0D141E; --m2:#162130; --mfg:#F2F5F8; --mfg2:#A9B5C4;
  --acc:var(--tq); --acc-t:var(--tq-t); --acc-ink:#03201F; --acc-soft:rgba(0,207,200,.16);
  --display:"Sora",ui-sans-serif,system-ui,sans-serif; --body:"Manrope",ui-sans-serif,system-ui,sans-serif; --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --r-s:12px; --r-m:18px; --r-l:28px; --nav-h:66px;
  --gx:max(16px,env(safe-area-inset-left,0px));
  color-scheme:light;
}
body.run{--acc:var(--or);--acc-t:var(--or-t);--acc-ink:#2A0E02;--acc-soft:rgba(255,106,46,.14)}
html,body{background:var(--paper);color:var(--ink)}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance;line-height:1.12;font-weight:800}
p{margin:0}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eye{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink3)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--paper2);color:var(--ink2);white-space:nowrap}
.tag.sim{background:#FFF1C9;color:#6B4A00}.tag.gps{background:#D9F2E6;color:#0F5A3A}.tag.demo{background:#E7E3F7;color:#433A79}
.tag.na{background:var(--paper2);color:var(--ink3)}

/* pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 20px;border-radius:16px;font-weight:800;font-size:16px;text-align:center}
.btn-pri{background:var(--acc);color:var(--acc-ink)}
.btn-pri.xl{min-height:62px;font-size:18px;border-radius:20px;width:100%}
.btn-ink{background:var(--ink);color:#fff}
.btn-sec{background:var(--card);color:var(--ink);border:1.5px solid var(--hair2)}
.btn-ghost{color:var(--ink2);min-height:44px;font-weight:800;padding:0 6px}
.btn-danger{background:#FBE3D9;color:#8A2A06}
.link{color:var(--acc-t);font-weight:800;text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--hair);flex:none}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 15px;border-radius:999px;background:var(--card);border:1.5px solid var(--hair2);font-size:14px;font-weight:800;white-space:nowrap;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--gx));padding:2px var(--gx)}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--paper2);gap:4px}
.seg button{flex:1;min-height:44px;border-radius:10px;font-weight:800;font-size:14px;color:var(--ink2);padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,34,.15)}

/* struttura */
.shell{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(8px + env(safe-area-inset-top,0px)) var(--gx) 8px;background:rgba(245,242,235,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:8px;min-height:44px}
.brand .sym{height:30px;width:auto;display:block}
.brand .wm{height:17px;width:auto;display:block}
body[data-exp="explore"] .top{position:absolute;left:0;right:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
body[data-exp="explore"] .top .brand{background:rgba(245,242,235,.94);padding:4px 12px 4px 8px;border-radius:999px}
body[data-exp="explore"] .top .brand .wm{display:none}
.tg{display:flex;padding:3px;border-radius:999px;background:var(--card);border:1px solid var(--hair)}
.tg button{min-width:48px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--ink3)}
.tg button[aria-pressed="true"]{background:var(--ink);color:#fff}
main{padding:4px var(--gx) calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
body[data-exp="explore"] main{padding-top:0}
.view{display:flex;flex-direction:column;gap:20px}
.view.enter{animation:vin .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-m)}
.pad{padding:16px}
.empty{padding:20px;border:1.5px dashed var(--hair2);border-radius:var(--r-m);color:var(--ink2);font-size:15px;background:rgba(255,255,255,.5)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:600;line-height:1.4}
.banner.demo{background:#ECE8FA;color:#2F2766}.banner.sim{background:#FFF4D6;color:#5A3E00}.banner.info{background:#E3F1F6;color:#0B4258}.banner.err{background:#FCE4DA;color:#7A2405}
.bar{height:10px;border-radius:10px;background:var(--paper2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:10px}
.ask{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r-m);background:var(--ink);color:#fff;width:100%;text-align:left;min-height:60px}
.ask svg{flex:none}
.ask small{display:block;color:#C5CCD6;font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));z-index:120;background:var(--ink);color:#fff;font-weight:800;padding:12px 18px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.top{bottom:calc(108px + env(safe-area-inset-bottom,0px))}

/* barra di navigazione con incavo liquido (dalla GIF di riferimento):
   la voce attiva sale in una sfera scura, la barra si piega sotto di lei e l'incavo scorre verso la voce scelta */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.nav .in{position:relative;pointer-events:auto;width:100%;max-width:560px;height:calc(66px + env(safe-area-inset-bottom,0px))}
.tb-bg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 -6px 14px rgba(20,26,34,.13));pointer-events:none}
.tb-bg path{fill:#fff}
.tb-items{position:absolute;left:max(0px,env(safe-area-inset-left,0px));right:max(0px,env(safe-area-inset-right,0px));top:0;height:66px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tb-items button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;padding-bottom:9px;min-height:66px;color:var(--ink3);font-size:12px;font-weight:800}
.tb-items button>svg{transition:opacity .2s,transform .3s}
.tb-items button[aria-current="page"]{color:var(--ink)}
.tb-items button.on>svg{opacity:0;transform:translateY(10px)}
.tb-items .start .c{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink)}
.tb-ball{position:absolute;left:0;top:0;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--acc);display:grid;place-items:center;
  box-shadow:0 10px 18px -8px rgba(20,26,34,.65);pointer-events:none;will-change:transform,opacity;z-index:2}
.tb-ball svg{width:24px;height:24px;display:block}

/* ===== HOME ===== */
.h-hello h1{font-size:clamp(30px,8.6vw,40px)}
.h-hello p{font-size:17px;color:var(--ink2);max-width:36ch;margin-top:8px}
.pcard{position:relative;display:block;border-radius:var(--r-l);overflow:hidden;background:#222;color:#fff;text-align:left;width:100%;aspect-ratio:4/3.1;min-height:240px}
.pcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcard .scr{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,9,15,0) 35%,rgba(5,9,15,.78) 100%)}
.pcard .txt{position:absolute;left:0;right:0;bottom:0;padding:18px;display:flex;flex-direction:column;gap:4px}
.pcard .txt h2,.pcard .txt h3{color:#fff;font-size:24px}
.pcard .meta{font-size:14px;font-weight:700;color:#EEF1F4}
.pcard .why{position:absolute;top:12px;left:12px;font-size:12px;font-weight:800;background:rgba(245,242,235,.94);color:var(--ink);padding:5px 10px;border-radius:999px}
.ill{position:absolute;right:10px;top:10px;font-size:11px;font-weight:800;color:#fff;background:rgba(5,9,15,.55);padding:4px 8px;border-radius:999px}
.steps3{display:grid;gap:12px}
.steps3 .s{display:flex;gap:12px;align-items:flex-start}
.steps3 .n{width:30px;height:30px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;font-family:var(--display)}
.wk{display:flex;flex-direction:column;gap:10px}
.wk .big{font-size:40px;font-weight:800;line-height:1}
.lastact{display:flex;align-items:center;gap:14px;width:100%;text-align:left}

/* ===== PERCORSI (Explore) ===== */
.ex-hero{position:relative;margin:0 calc(-1*var(--gx));height:min(68vh,560px);min-height:400px;overflow:hidden;background:#3a4a5a;color:#fff}
.ex-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ex-hero .scr{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,9,15,.25) 0%,rgba(5,9,15,0) 30%,rgba(5,9,15,.72) 100%)}
.ex-hero .txt{position:absolute;left:var(--gx);right:var(--gx);bottom:84px;display:flex;flex-direction:column;gap:8px}
.ex-hero h1{font-size:clamp(36px,11vw,54px);color:#fff;line-height:1.02}
.ex-hero .eye{color:#F4F1EA}
.ex-hero p{font-size:17px;font-weight:600;color:#F4F1EA;max-width:30ch}
.ex-search{position:relative;margin:-64px 0 0;z-index:2}
.ex-search label{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 16px;border-radius:18px;background:var(--card);box-shadow:0 10px 30px rgba(5,9,15,.18)}
.ex-search input{flex:1;min-width:0;background:none;border:0;font-size:16px;outline:none;min-height:52px}
.fgroup{display:flex;flex-direction:column;gap:8px}
.fgroup .eye{margin-left:2px}
.rlist{display:grid;gap:18px}
.rcard{display:block;width:100%;text-align:left;background:var(--card);border-radius:var(--r-l);overflow:hidden;border:1px solid var(--hair)}
.rcard figure{margin:0;position:relative;aspect-ratio:16/9;background:#c9c2b4}
.rcard figure img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rcard .diff{position:absolute;left:12px;top:12px}
.rcard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.rcard h3{font-size:21px}
.stats4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.stats4>span{display:flex;flex-direction:column;gap:1px;min-width:0}
.stats4 b{font-family:var(--display);font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats4>span>span{font-size:12px;color:var(--ink3);font-weight:700}
.dtag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:rgba(245,242,235,.95);color:var(--ink)}
.dtag i{width:8px;height:8px;border-radius:50%}
.rd-hero{position:relative;margin:0 calc(-1*var(--gx));height:min(52vh,440px);min-height:300px;overflow:hidden;background:#3a4a5a}
.rd-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rd-hero .scr{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,9,15,.35) 0%,rgba(5,9,15,0) 35%)}
.rd-hero .back{position:absolute;left:var(--gx);top:calc(66px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 10px;border-radius:999px;background:rgba(245,242,235,.95);color:var(--ink);font-weight:800}
.rd-hero .ill{top:auto;bottom:40px}
.rd-sheet{position:relative;margin:-28px calc(-1*var(--gx)) 0;padding:22px var(--gx) 0;background:var(--paper);border-radius:28px 28px 0 0;display:flex;flex-direction:column;gap:18px}
.rd-sheet h1{font-size:clamp(28px,8vw,36px)}
.map{position:relative;border-radius:var(--r-l);overflow:hidden;background:#EFE8D8;border:1px solid var(--hair);aspect-ratio:4/3}
.map canvas,.map>svg{position:absolute;inset:0;width:100%;height:100%}
.map .lab{position:absolute;left:10px;bottom:10px;right:10px;font-size:12px;color:var(--ink);font-weight:700;background:rgba(255,255,255,.88);padding:5px 9px;border-radius:9px;width:max-content;max-width:calc(100% - 20px)}
.map .attr{position:absolute;right:0;bottom:0;font-size:11px;background:rgba(255,255,255,.85);padding:2px 6px;color:#333}
.map .attr a{color:#0B4F6C}
.map .tiles{position:absolute;inset:0;overflow:hidden}
.map .tiles img{position:absolute;width:256px;height:256px;max-width:none;user-select:none}
.map .mstate{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ink2);text-align:center;padding:20px}
.routepath{fill:none;stroke-linecap:round;stroke-linejoin:round}
.prof{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.prof svg{display:block;width:100%;height:auto;overflow:visible}
.prof svg:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.est{font-size:14px;color:var(--ink2);background:var(--paper2);padding:10px 12px;border-radius:12px}

/* ===== ATTIVITÀ (Move) ===== */
.move{position:fixed;inset:0;z-index:60;background:var(--night);color:var(--mfg);display:flex;flex-direction:column;color-scheme:dark}
.move .in{max-width:620px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.mv-hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;min-height:36px;padding:0 12px;border-radius:999px;background:var(--m1);font-size:14px;font-weight:800;color:var(--mfg)}
.pill i{width:10px;height:10px;border-radius:50%;flex:none}
.pill.simb{background:#3A2E05;color:#FFE08A}
.mv-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:12px;overscroll-behavior:contain}
.mv-big{text-align:center;padding:4px 0 2px}
.mv-big .l{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mfg2)}
.mv-big .v{font-size:clamp(64px,24vw,124px);font-weight:800;line-height:.98;color:var(--acc)}
.mv-big .u{font-size:16px;color:var(--mfg2);font-weight:700}
.mv-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mt{position:relative;background:var(--m1);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:12px 14px;text-align:left;width:100%;min-height:76px;color:var(--mfg)}
.mt .num{font-size:clamp(26px,8.5vw,38px);font-weight:800;line-height:1.08;display:block}
.mt .lbl{font-size:13px;color:var(--mfg2);font-weight:800;letter-spacing:.02em;display:block}
.mt.na .num{font-size:20px;color:var(--mfg2)}
.mv-note{text-align:center;font-size:14px;color:var(--mfg2);min-height:20px}
.mv-note.warn{color:#FFD27A;font-weight:700}
.mv-ctrl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));background:var(--night);border-top:1px solid rgba(255,255,255,.06)}
.mv-ctrl .btn{min-height:72px;font-size:20px;border-radius:22px}
.btn-pause{background:var(--m2);color:var(--mfg)}
.btn-stop{background:#2B1714;color:#FFB4A8}
.btn-stop.armed{background:#FF7A6B;color:#1B0503}
.move .btn-pri{color:var(--acc-ink)}
@media (max-height:620px){.mv-big .v{font-size:clamp(56px,18vw,88px)}.mt{min-height:64px;padding:8px 12px}.mt .num{font-size:26px}.mv-ctrl .btn{min-height:60px}}
@media (orientation:landscape) and (max-height:520px){
  .move .in{max-width:980px}
  .mv-body{display:grid;grid-template-columns:1fr 1.2fr;align-items:start;column-gap:16px}
  .mv-big{grid-row:1/3;align-self:center}.mv-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mv-big .v{font-size:min(84px,22vh)}.mt{min-height:58px;padding:8px 12px}.mt .num{font-size:24px}
  .mv-ctrl{padding-top:8px}.mv-ctrl .btn{min-height:52px;font-size:18px}
}

/* ===== PROGRESSI (Evolve) ===== */
body[data-exp="evolve"]{--paper:#F7F5F0}
.ev-head .eye{color:var(--acc-t)}
.ev-head h1,.serif{font-family:var(--serif);font-weight:500;letter-spacing:-.01em}
.ev-head h1{font-size:clamp(34px,9.5vw,46px);line-height:1.05}
.ev-hero{padding:22px 20px;border-radius:var(--r-l);background:var(--card);border:1px solid var(--hair);display:flex;flex-direction:column;gap:12px}
.ev-hero .big{font-size:clamp(48px,15vw,68px);font-weight:700;line-height:.95}
.ev-hero .of{font-size:18px;color:var(--ink3);font-weight:700}
.sect{display:flex;flex-direction:column;gap:12px}
.sect>h2{font-size:20px}
body[data-exp="evolve"] .sect h2{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:-.01em}
.sect>.sub{font-size:14px;color:var(--ink3);margin-top:-6px}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding:0 0 0;position:relative}
.bars .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink3);pointer-events:none}

  if(S.demo)h+=banner('demo','<b>Storico dimostrativo.</b> Numeri inventati, separati dalle tue attività.');
  else if(list.length&&srcFor()==='sim')h+=banner('sim','Attività <b>simulate</b>: utili per provare il prototipo, non descrivono un allenamento vero.');
  h+=srcSwitch();
  if(Store.readErr)h+=banner('err','L\'archivio di questo browser non è leggibile. Non viene sovrascritto finché non lo svuoti dal Profilo.');
  if(!list.length){return h+'<div class="ev-hero"><p class="serif" style="font-size:24px;line-height:1.25">Dopo la prima '+W('uscita','corsa')+' qui trovi chilometri della settimana, andamento, confronti e intertempi.</p><p class="muted">Nessun record o conclusione viene calcolato senza dati sufficienti.</p>'+
    '<button type="button" class="btn btn-pri" data-act="start">'+ICON.play+W('Registra il primo giro','Registra la prima corsa')+'</button>'+(S.demo?'':'<button type="button" class="btn btn-sec" data-act="demoOn">Guarda un esempio dimostrativo</button>')+'</div>'+goalCard(goal,wk)}
  /* 1. risultato principale */
  var met=wk.km>=goal,pct=Math.min(100,Math.round(wk.km/goal*100));
  h+='<section class="ev-hero" aria-labelledby="evRes"><p class="eye" id="evRes">Questa settimana · '+weekLbl(wk.start)+'</p><div class="row" style="align-items:baseline;flex-wrap:wrap;gap:8px"><span class="num big">'+kmTxt(wk.km)+'</span><span class="of">di '+goal+' km</span></div>'+
    '<span class="bar" role="img" aria-label="'+pct+'% dell\'obiettivo"><i style="width:'+pct+'%"></i></span>'+
    '<p style="font-size:16px;font-weight:700;color:'+(met?'var(--ok)':'var(--ink2)')+'">'+(met?'Obiettivo raggiunto'+(wk.km>goal?', con '+kmTxt(wk.km-goal)+' km in più':'')+'. Ottimo lavoro.':'Mancano '+kmTxt(goal-wk.km)+' km. '+wk.items.length+' attività finora.')+'</p>'+
    '<button type="button" class="btn btn-sec" data-act="goal" style="align-self:flex-start;min-height:44px">Modifica obiettivo</button></section>';
  /* 2. andamento */
  var weeks=[];for(var i=7;i>=0;i--)weeks.push(weekOf(list,i));var sel=S.evWeek==null?7:S.evWeek,sw=weeks[sel];
  h+='<section class="sect" aria-labelledby="evTr"><h2 id="evTr">Andamento</h2><p class="sub">Chilometri delle ultime 8 settimane. Tocca una barra.</p><div class="card pad">'+
    bars(weeks.map(function(w,i){return {x:i===7?'questa':'-'+(7-i),v:w.km,label:weekLbl(w.start)+': '+kmTxt(w.km)+' km in '+w.items.length+' attività'}}),{key:'wk',sel:sel,goal:goal,goalLbl:'obiettivo '+goal+' km',aria:'Chilometri per settimana'})+
    '<p class="readout" id="wkRead" style="margin-top:10px">'+weekLbl(sw.start)+': '+kmTxt(sw.km)+' km in '+sw.items.length+' attività</p></div></section>';
  /* 3. confronto */
  h+='<section class="sect" aria-labelledby="evCmp"><h2 id="evCmp">Confronto</h2>'+compareBlock(list[0],list)+'</section>';
  /* storico navigabile */
  var hist=S.evWeek!=null?sw.items:list,shown=S.histAll?hist:hist.slice(0,6),lastM='';
  h+='<section class="sect" aria-labelledby="evHist"><div class="row"><h2 id="evHist" class="grow">Storico</h2>'+(S.evWeek!=null?'<button type="button" class="link" data-act="histAllWeeks">Tutte le settimane</button>':'')+'</div>'+
    (S.evWeek!=null?'<p class="sub">Settimana '+weekLbl(sw.start)+'</p>':'')+
    (hist.length?'<div class="card alist" style="padding:0 12px">'+shown.map(function(a){var m=cap(new Date(a.startedAt).toLocaleDateString('it-IT',{month:'long',year:'numeric'})),hd=m!==lastM&&S.evWeek==null?'<p class="mhead">'+m+'</p>':'';lastM=m;return hd+actRow(a)}).join('')+'</div>'+
      (hist.length>shown.length?'<button type="button" class="btn btn-sec" data-act="histMore">Mostra tutte ('+hist.length+')</button>':''):'<div class="empty">Nessuna attività in questa settimana.</div>')+'</section>';
  /* record */
  h+='<section class="sect" aria-labelledby="evRec"><h2 id="evRec">Record personali</h2>'+recordsBlock(list)+'</section>';
  /* dettaglio facoltativo */
  var adv=S.adv==null?prof().dataLevel>=2:S.adv;
  h+='<section class="sect"><button type="button" class="btn btn-sec" data-act="adv" aria-expanded="'+adv+'" style="justify-content:space-between">Dati avanzati della settimana<span aria-hidden="true">'+(adv?'−':'+')+'</span></button>'+(adv?advWeek(wk):'')+'</section>';
  /* prossimo passo */
  h+=tipBlock(list,goal,wk)+askBtn('"Come stanno andando i miei allenamenti?"');
  return h}
function goalCard(goal,wk){return '<div class="card pad row"><div class="grow"><b>Obiettivo settimanale: '+goal+' km</b><div class="muted" style="font-size:14px">Puoi cambiarlo quando vuoi.</div></div><button type="button" class="btn btn-sec" data-act="goal" style="min-height:44px">Modifica</button></div>'}
function actRow(a){var v=a.sport==='run'?paceStr(paceOf(a))+' /km':nf(spdOf(a),1)+' km/h';
  return '<button type="button" class="arow" data-act="openAct" data-id="'+a.id+'"><span class="ic">'+sportIcon(a.sport)+'</span><span class="grow"><b style="display:block">'+esc(a.title)+'</b><span class="muted" style="font-size:14px">'+dateTxt(a.startedAt)+' · '+dur(a.movingSec)+(a.source==='sim'?' · simulata':'')+'</span></span><span style="text-align:right"><span class="num" style="font-weight:800;display:block">'+kmTxt(a.distanceKm)+' km</span><span class="muted" style="font-size:13px">'+v+'</span></span></button>'}
function advWeek(wk){var t=wk.items.reduce(function(s,a){return s+a.movingSec},0),up=wk.items.filter(function(a){return a.ascentM!=null}),upS=up.reduce(function(s,a){return s+a.ascentM},0);
  return '<div class="kv"><div><b>'+dur(t)+'</b><span>Tempo in movimento</span></div><div><b>'+wk.items.length+'</b><span>Attività</span></div><div'+(up.length?'':' class="na"')+'><b>'+(up.length?upS+' m':'non disponibile')+'</b><span>Salita'+(up.length&&up.length<wk.items.length?' ('+up.length+' su '+wk.items.length+')':'')+'</span></div><div class="na"><b>non disponibile</b><span>Frequenza cardiaca: nessun sensore nel prototipo</span></div></div>'}
/* confronto con attività dello stesso sport e della stessa fonte */
function compareBlock(a,list){if(!a)return '';var others=list.filter(function(x){return x.id!==a.id&&x.distanceKm>=a.distanceKm*.6&&x.distanceKm<=a.distanceKm*1.6});
  var lo=a.distanceKm*.6,hi=a.distanceKm*1.6;
  if(others.length<3)return '<div class="card pad stack" style="gap:6px"><b>Servono più attività simili</b><p class="muted" style="font-size:14px">Per un confronto onesto servono almeno 3 attività tra '+kmTxt(lo)+' e '+kmTxt(hi)+' km. Ne hai '+others.length+'.</p></div>';
  var run=a.sport==='run',me=spdOf(a),vals=others.map(spdOf),avg=vals.reduce(function(s,v){return s+v},0)/vals.length;
  var txt;if(run){var d=Math.round(paceOf(a)-others.reduce(function(s,x){return s+paceOf(x)},0)/others.length);txt=Math.abs(d)<3?'In linea con la tua media':Math.abs(d)+' s/km '+(d<0?'più veloce':'più lento')+' della tua media'}
  else{var dv=me-avg;txt=Math.abs(dv)<.3?'In linea con la tua media':nf(Math.abs(dv),1)+' km/h '+(dv>0?'più veloce':'più lento')+' della tua media'}
  var all=vals.concat([me]),mn=Math.min.apply(null,all),mx=Math.max.apply(null,all),X=function(v){return 6+(v-mn)/((mx-mn)||1)*88};
  var lbl=function(v){return run?paceStr(3600/v)+' /km':nf(v,1)+' km/h'};
  return '<div class="card pad stack" style="gap:8px"><p class="muted" style="font-size:14px">'+esc(a.title)+' ('+dateTxt(a.startedAt)+') contro le tue '+others.length+' attività tra '+kmTxt(lo)+' e '+kmTxt(hi)+' km.</p><b style="font-size:19px">'+txt+'</b>'+
    '<div class="rangebar" role="img" aria-label="A sinistra le più lente, a destra le più veloci. La tua: '+lbl(me)+'; media '+lbl(avg)+'"><span class="ln"></span>'+vals.map(function(v){return '<span class="p" style="left:'+X(v).toFixed(1)+'%"></span>'}).join('')+'<span class="p me" style="left:'+X(me).toFixed(1)+'%"></span></div>'+
    '<div class="row" style="font-size:13px;font-weight:700;color:var(--ink3)"><span class="grow">← più lenta · '+lbl(mn)+'</span><span>'+lbl(mx)+' · più veloce →</span></div></div>'}
function recordsBlock(list){if(list.length<3)return '<div class="empty">I record compaiono dopo almeno 3 attività. Ne hai '+list.length+'.</div>';var run=list[0].sport==='run',cells=[];
  var longest=list.reduce(function(b,a){return a.distanceKm>b.distanceKm?a:b});cells.push([kmTxt(longest.distanceKm)+' km','Distanza più lunga',longest]);
  if(run){var f5=list.filter(function(a){return a.distanceKm>=5});if(f5.length){var bp=f5.reduce(function(b,a){return paceOf(a)<paceOf(b)?a:b});cells.push([paceStr(paceOf(bp))+' /km','Miglior passo medio su 5 km o più',bp])}else cells.push(['–','Passo medio: serve una corsa di almeno 5 km',null]);
    var bk=null;list.forEach(function(a){(a.splits||[]).forEach(function(s){if(a.splitKm===1&&(!bk||s<bk.s))bk={s:s,a:a}})});cells.push(bk?[paceStr(bk.s)+' /km','Chilometro più veloce',bk.a]:['–','Chilometro più veloce: nessun intertempo',null])}
  else{var f20=list.filter(function(a){return a.distanceKm>=20});if(f20.length){var bs=f20.reduce(function(b,a){return spdOf(a)>spdOf(b)?a:b});cells.push([nf(spdOf(bs),1)+' km/h','Miglior media su 20 km o più',bs])}else cells.push(['–','Media: serve un giro di almeno 20 km',null]);
    var ups=list.filter(function(a){return a.ascentM!=null});if(ups.length){var bu=ups.reduce(function(b,a){return a.ascentM>b.ascentM?a:b});cells.push([bu.ascentM+' m','Più salita in un giro',bu])}else cells.push(['–','Salita: nessun dato di quota affidabile',null])}
  return '<div class="kv">'+cells.map(function(c){return c[2]?'<div><b>'+c[0]+'</b><span>'+c[1]+'</span><button type="button" class="link" data-act="openAct" data-id="'+c[2].id+'" style="font-size:13px;min-height:32px">'+dateTxt(c[2].startedAt)+'</button></div>':'<div class="na"><b>'+c[0]+'</b><span>'+c[1]+'</span></div>'}).join('')+'</div>'}
function tipBlock(list,goal,wk){var t=[],a=list[0];if(!a)return '';var days=Math.floor((Date.now()-new Date(a.startedAt))/864e5);
  if(wk.km>=goal)t.push('Obiettivo della settimana raggiunto: puoi aggiungere un\'uscita facile oppure riposare.');
  else if(days>=4)t.push('Sono passati '+days+' giorni dall\'ultima attività: una sessione breve e facile aiuta a riprendere il ritmo.');
  var sp=a.splits||[];if(sp.length>=3){var f=sp[0],l=sp[sp.length-1];if(l>f*1.06)t.push('Nell\'ultima attività hai rallentato nel finale: la prossima volta parti un po\' più piano.');else t.push('Ritmo regolare nell\'ultima attività: un buon segno di gestione dello sforzo.')}
  if(prof().goal===1){var lg=list.reduce(function(b,x){return x.distanceKm>b.distanceKm?x:b});t.push('Per preparare una gara conta l\'uscita lunga: la tua più lunga è '+kmTxt(lg.distanceKm)+' km.')}
  if(!t.length)t.push('Continua così: per indicazioni più precise servono più attività.');
  return '<aside class="tip" aria-labelledby="tipT"><p class="eye" id="tipT">Prossimo passo</p><p style="font-size:16px;font-weight:600">'+esc(t[0])+'</p>'+(t[1]?'<p style="font-size:15px;color:var(--ink2)">'+esc(t[1])+'</p>':'')+'<p class="muted" style="font-size:13px">Suggerimento basato su regole semplici sui tuoi dati, non su intelligenza artificiale.</p></aside>'}
function afterEvolve(){}

/* ---- dettaglio attività ---- */
function viewAct(){var a=findAct(S.actId);if(!a)return '<button type="button" class="btn-ghost row" data-go="evolve">'+ICON.back+'Progressi</button><div class="empty">Attività non trovata. Potrebbe essere stata eliminata.</div>';
  var run=a.sport==='run',list=dataset(a.sport),h='';
  h+='<button type="button" class="btn-ghost row" data-act="backEv" style="align-self:flex-start;gap:4px">'+ICON.back+'Progressi</button>';
  if(S.from==='save')h+=banner('info','<b>Salvata nell\'archivio di questo browser.</b> Non è un backup cloud: se cancelli i dati del browser la perdi. Puoi esportarla dal Profilo.'+(a.trackThinned?' La traccia è stata alleggerita per farla stare in memoria.':''));
  h+='<header class="ev-head"><p class="eye">'+cap(dateTxt(a.startedAt,true))+'</p><h1 style="margin:4px 0 8px">'+esc(a.title)+'</h1><div class="row" style="flex-wrap:wrap;gap:6px">'+srcTag(a)+'<span class="tag">'+(run?'Running':'Ciclismo')+'</span>'+(a.routeId&&famousById(a.routeId)?'<span class="tag">'+esc(famousById(a.routeId).name)+'</span>':'')+'</div></header>';
  var asc=a.ascentM==null?'<div class="na"><b>non disponibile</b><span>Salita: '+(a.source==='gps'?'quota GPS assente o imprecisa':'nessun dato')+'</span></div>':'<div><b>'+a.ascentM+' m</b><span>Salita'+(a.source==='sim'?' (quote del tracciato)':a.source==='demo'?' (inventata)':'')+'</span></div>';
  h+='<div class="kv"><div><b>'+kmTxt(a.distanceKm)+' km</b><span>Distanza</span></div><div><b>'+clock(a.movingSec)+'</b><span>Tempo in movimento</span></div><div><b>'+(run?paceStr(paceOf(a))+'<small style="font-size:15px"> /km</small>':nf(spdOf(a),1)+'<small style="font-size:15px"> km/h</small>')+'</b><span>'+(run?'Passo medio':'Velocità media')+'</span></div>'+asc+'</div>';
  if(a.source==='gps'&&a.track&&a.track.length>1)h+='<div class="map rmap" id="actMap"></div><p class="muted" style="font-size:13px;margin-top:-10px">Traccia realmente acquisita: '+a.track.length+' posizioni.</p>';
  else if(a.source==='gps')h+='<div class="empty">Nessuna traccia da mostrare: il GPS non ha fornito abbastanza posizioni precise.</div>';
  else if(a.routeId&&famousById(a.routeId))h+='<div class="map rmap" id="actMap"></div><p class="muted" style="font-size:13px;margin-top:-10px">'+(a.source==='sim'?'Percorso simulato: ':'Attività dimostrativa: ')+esc(famousById(a.routeId).name)+'. Non è una traccia registrata.</p>';
  if(a.source==='gps'&&!a.demo){if(Social.on())h+=a.sharedId?'<p class="tag gps" style="align-self:flex-start">Condivisa con gli amici</p>':'<button type="button" class="btn btn-sec" data-act="shareAct" data-id="'+a.id+'">'+ICON.people+'Condividi con gli amici</button>';
    else h+='<p class="muted" style="font-size:14px">Accedi alla Community per condividere questa attività con gli amici.</p>'}
  h+=actEnergy(a);
  var spl=a.splits||[],u=a.splitKm||1;
  h+='<section class="sect" aria-labelledby="spT"><h2 id="spT">Intertempi</h2><p class="sub">'+(run?'Ogni chilometro. Barre più alte = più veloce; la scala parte dall\'85% del km più lento per mostrare le differenze.':'Ogni '+u+' km. Barre più alte = più veloce; la scala non parte da zero.')+'</p>';
  if(spl.length){var sp=spl.map(function(s){return u/(s/3600)}),best=sp.indexOf(Math.max.apply(null,sp));
    h+='<div class="card pad">'+bars(spl.map(function(s,i){return {x:run?String(i+1):(i*u)+'–'+((i+1)*u),v:u/(s/3600),label:(run?'Km '+(i+1)+': '+paceStr(s)+' /km':'Da '+(i*u)+' a '+((i+1)*u)+' km: '+nf(u/(s/3600),1)+' km/h')}}),{key:'sp',sel:S.spSel==null?best:S.spSel,aria:'Intertempi',base:Math.min.apply(null,sp)*.85})+
      '<p class="readout" id="spRead" style="margin-top:10px">'+splitTxt(a,S.spSel==null?best:S.spSel)+'</p></div>'+
      '<table class="splits"><thead><tr><th>'+(run?'Km':'Tratto')+'</th><th class="r">Tempo</th><th class="r">'+(run?'Passo':'Velocità')+'</th></tr></thead><tbody>'+spl.map(function(s,i){return '<tr><td>'+(run?i+1:(i*u)+'–'+((i+1)*u)+' km')+(i===best?' <span class="tag" style="padding:2px 7px">più veloce</span>':'')+'</td><td class="r">'+clock(s)+'</td><td class="r">'+(run?paceStr(s/u)+' /km':nf(u/(s/3600),1)+' km/h')+'</td></tr>'}).join('')+'</tbody></table>'}
  else h+='<div class="empty">Attività più corta di '+u+' km: nessun intertempo completo.</div>';
  h+='</section><section class="sect" aria-labelledby="cmT"><h2 id="cmT">Confronto</h2>'+compareBlock(a,sameSource(a))+'</section>';
  var adv=S.adv==null?prof().dataLevel>=2:S.adv;
  h+='<section class="sect"><button type="button" class="btn btn-sec" data-act="adv" aria-expanded="'+adv+'" style="justify-content:space-between">Dati avanzati<span aria-hidden="true">'+(adv?'−':'+')+'</span></button>';
  if(adv){var g=a.gpsStats||{};h+='<div class="kv"><div><b>'+clock(a.elapsedSec||a.movingSec)+'</b><span>Tempo totale con pause</span></div><div><b>'+clock(Math.max(0,(a.elapsedSec||a.movingSec)-a.movingSec))+'</b><span>Pausa</span></div>'+
    (a.source==='gps'?'<div><b>'+(g.points||0)+'</b><span>Posizioni GPS accettate</span></div><div><b>'+(g.avgAcc?'±'+g.avgAcc+' m':'–')+'</b><span>Precisione media</span></div>':'<div class="na"><b>non applicabile</b><span>Precisione GPS</span></div><div class="na"><b>'+(a.source==='sim'?'×20':'–')+'</b><span>'+(a.source==='sim'?'Velocità della simulazione':'Dati inventati')+'</span></div>')+
    '<div class="na"><b>non disponibile</b><span>Frequenza cardiaca</span></div><div class="na"><b>non disponibile</b><span>Potenza</span></div></div>'}
  h+='</section>'+askBtn('"Spiegami questa attività"');
  if(!a.demo)h+='<button type="button" class="btn btn-danger" data-act="delAct" data-id="'+a.id+'">Elimina questa attività</button>';
  return h}
function sameSource(a){return a.demo?DEMO[a.sport]:personal(a.sport).filter(function(x){return x.source===a.source})}
function splitTxt(a,i){var s=a.splits[i],u=a.splitKm||1;if(s==null)return '';return a.sport==='run'?'Km '+(i+1)+': '+clock(s)+' · passo '+paceStr(s)+' /km':'Da '+(i*u)+' a '+((i+1)*u)+' km: '+clock(s)+' · '+nf(u/(s/3600),1)+' km/h'}
var ACTMAP=null;
function afterAct(){var a=findAct(S.actId);if(!a)return;var mb=$('#actMap');if(!mb)return;if(ACTMAP)ACTMAP.destroy();ACTMAP=new MiniMap(mb,{label:'Mappa dell\'attività'});
  if(a.source==='gps'){var pts=a.track.map(function(p){return [p[0],p[1]]});ACTMAP.fit(pts,30);ACTMAP.setLines([{pts:pts}]);ACTMAP.setMarkers([{ll:pts[0],cls:'pin-start',html:'A',label:'Partenza'}])}
  else{var r=famousById(a.routeId);ACTMAP.fit(r.wp,30);var g=ROUTE_GEO[r.id];ACTMAP.setLines([g?{pts:g.pts,color:'#5C6370',dash:'1 0'}:{pts:r.wp,dash:'2 9',casing:false,color:'#141A22',w:4}]);
    if(!g)routeGeo(r).then(function(g2){if(S.view==='act'&&ACTMAP)ACTMAP.setLines([{pts:g2.pts,color:'#5C6370'}])}).catch(function(){})}}

/* ================= PROFILO ================= */
function viewProfile(){var P=prof(),n=Store.list(),kb=Math.round(Store.bytes()/1024);
  var segs=function(key,opts,cur,lbl){return '<div class="fgroup"><p class="eye" id="pl_'+key+'">'+lbl+'</p><div class="seg" role="group" aria-labelledby="pl_'+key+'">'+opts.map(function(o,i){var v=o[0];return '<button type="button" data-pref="'+key+'" data-v="'+v+'" aria-pressed="'+(String(cur)===String(v))+'">'+o[1]+'</button>'}).join('')+'</div></div>'};
  var gl=goalsFor(P.choice);
  return '<header class="ev-head"><p class="eye" style="color:var(--ink3)">Profilo</p><h1 style="font-family:var(--display);font-weight:800;font-size:30px">Le tue preferenze</h1></header>'+
  (S.demo?banner('demo','Modalità dimostrativa attiva.'):'')+accountCard()+
  '<section class="card pad stack" style="gap:16px" aria-label="Preferenze">'+
    segs('choice',[['bike','Ciclismo'],['run','Running'],['both','Entrambi']],P.choice,'Sport')+
    segs('level',[[0,'Principiante'],[1,'Intermedio'],[2,'Esperto']],P.level,'Livello · usato per le stime di durata')+
    segs('dataLevel',[[0,'Essenziale'],[1,'Standard'],[2,'Completa']],P.dataLevel,'Quantità di dati · indipendente dal livello')+

/* ================= PERCORSI PERSONALIZZATI =================
   Tappe toccate sulla mappa, tracciato calcolato da BRouter. Salvati in questo browser; condivisibili con un link,
   in chat, in bacheca e negli eventi (solo le tappe: chi lo riceve ricalcola lo stesso tracciato). */
var MYR=LS.get('myroutes',[]),SHARED={};if(!Array.isArray(MYR))MYR=[];
function hashStr(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
var PROFS={bike:[['safety','Strade tranquille','asfalto','Ciclabili e strade secondarie asfaltate'],['trekking','Anche sterrato','misto','Ciclabili, strade bianche, argini'],['fastbike','Strada veloce','asfalto','Asfalto, anche strade trafficate']],
  run:[['shortest','Strada','asfalto','Il percorso più breve tra le tappe'],['hiking-mountain','Sentieri','sentiero','Preferisce sentieri e mulattiere']]};
function profInfo(sp,p){var l=PROFS[sp]||PROFS.bike;for(var i=0;i<l.length;i++)if(l[i][0]===p)return l[i];return l[0]}
function routeKey(wp,pr){return 'u'+hashStr(pr+'|'+wp.map(function(p){return p[0].toFixed(5)+','+p[1].toFixed(5)}).join(';'))}
function diffOf(km,up,sp){var r=up/Math.max(.1,km);if(sp==='run')return km>15||r>30?'Impegnativo':km>8||r>12?'Medio':'Facile';return km>90||up>1500||r>25?'Impegnativo':km>45||up>500||r>12?'Medio':'Facile'}
function photoOf(sp,surf,up,km){return surf==='sentiero'?'sentiero-bosco':surf==='misto'?'sterrato-campi':up/Math.max(.1,km)>15?'crinale':sp==='run'?'argine-fiume':'pianura-filari'}
function makeRoute(o){var pi=profInfo(o.sport,o.prof),km=Number(o.km)||0,up=Math.round(Number(o.up)||0);
  var wpn=Array.isArray(o.wpn)&&o.wpn.length===o.wp.length?o.wpn.map(function(n){return n?String(n).slice(0,60):''}):null;
  return {wpn:wpn,id:o.id||routeKey(o.wp,pi[0]),custom:!o.shared,shared:!!o.shared,from:o.from||null,sport:o.sport,name:String(o.name||'Percorso senza nome').slice(0,80),wp:o.wp,prof:pi[0],km:km,up:up,
    surface:pi[2],diff:diffOf(km,up,o.sport),photo:photoOf(o.sport,pi[2],up,km),region:o.shared?'Percorso condiviso':'Il tuo percorso',tag:[],created:o.created||new Date().toISOString(),
    about:o.shared?'Condiviso'+(o.from?' da '+o.from:'')+'. Il tracciato viene ricalcolato da BRouter sulle '+o.wp.length+' tappe scelte da chi l\'ha creato.':'Creato da te con '+o.wp.length+' tappe. Tracciato calcolato da BRouter su strade e sentieri OpenStreetMap.'}}
MYR=MYR.filter(function(r){return r&&r.wp&&r.wp.length>1}).map(function(r){return makeRoute(r)});
function myRoute(id){for(var i=0;i<MYR.length;i++)if(MYR[i].id===id)return MYR[i];return null}
function myRoutes(sp){return MYR.filter(function(r){return !sp||r.sport===sp})}
/* da qui in poi un id può indicare un percorso famoso, uno tuo o uno ricevuto */
var famousOnly=famousById;famousById=function(id){return famousOnly(id)||myRoute(id)||SHARED[id]||null};
function persistMy(){if(!LS.set('myroutes',MYR.map(function(r){return {id:r.id,sport:r.sport,name:r.name,wp:r.wp,wpn:r.wpn,prof:r.prof,km:r.km,up:r.up,created:r.created}}))){toast('Percorso non salvato: memoria del browser non disponibile');return false}return true}
function saveMyRoute(r,oldId){var c=makeRoute({id:r.id,sport:r.sport,name:r.name,wp:r.wp,wpn:r.wpn,prof:r.prof,km:r.km,up:r.up,created:r.created});
  MYR=MYR.filter(function(x){return x.id!==c.id&&x.id!==oldId});MYR.unshift(c);delete SHARED[c.id];return persistMy()?c:null}
function delMyRoute(id){MYR=MYR.filter(function(x){return x.id!==id});persistMy()}
/* formato compatto per link, chat, post ed eventi: solo nome, sport, profilo e tappe */
function routeObj(r){var o={v:1,n:r.name,s:r.sport,p:r.prof,k:Math.round(rKm(r)*10)/10,u:rUp(r),w:r.wp.map(function(p){return [Math.round(p[0]*1e5),Math.round(p[1]*1e5)]})};if(famousOnly(r.id))o.f=r.id;if(r.wpn&&r.wpn.some(Boolean))o.m=r.wpn.map(function(n){return n||''});return o}
function b64u(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
function shareLink(r){return location.href.split('#')[0]+'#r='+b64u(JSON.stringify(routeObj(r)))}
/* percorso ricevuto: si controlla tutto prima di usarlo (arriva da altri) */
function routeFromObj(o,from){if(o&&typeof o.f==='string'&&famousOnly(o.f))return famousOnly(o.f);if(!o||typeof o!=='object'||!Array.isArray(o.w)||o.w.length<2||o.w.length>40||(o.s!=='bike'&&o.s!=='run'))return null;
  var wp=[];for(var i=0;i<o.w.length;i++){var p=o.w[i];if(!Array.isArray(p)||!isFinite(p[0])||!isFinite(p[1]))return null;var la=p[0]/1e5,lo=p[1]/1e5;if(Math.abs(la)>85||Math.abs(lo)>180)return null;wp.push([la,lo])}
  var r=makeRoute({shared:true,from:from||null,sport:o.s,name:String(o.n||'Percorso condiviso').slice(0,80),wp:wp,wpn:Array.isArray(o.m)&&o.m.length===wp.length?o.m.map(function(n){return typeof n==='string'?n:''}):null,prof:String(o.p||''),km:Math.max(0,Math.min(2000,Number(o.k)||0)),up:Math.max(0,Math.min(20000,Number(o.u)||0))});
  var mine=myRoute(r.id);if(mine)return mine;if(famousOnly(r.id))return famousOnly(r.id);if(!SHARED[r.id])SHARED[r.id]=r;return SHARED[r.id]}
function routeFromLink(h){var m=/[#&]r=([A-Za-z0-9_-]+)/.exec(h||'');if(!m)return null;try{return routeFromObj(JSON.parse(unb64u(m[1])),null)}catch(e){return null}}
function routeChip(r,extra){return '<button type="button" class="rchip" data-act="route" data-route="'+r.id+'">'+sportIcon(r.sport)+'<span class="grow"><b>'+esc(r.name)+'</b><small>'+(extra?esc(extra)+' · ':'')+rkm1(rKm(r))+' km · '+rUp(r)+' m'+(r.custom?' · tuo':r.shared?' · condiviso':' · famoso')+'</small></span>'+ICON.chev+'</button>'}

/* ================= ENERGIA E COSA PORTARE =================
   Regole dichiarate, per adulti in salute; non sono indicazioni mediche.
   Corsa: ~1 kcal per kg per km in piano. Bici: MET dalla velocità media (Compendium of Physical Activities) × kg × ore.
   Salita: lavoro meccanico (peso × 9,81 × dislivello) con rendimento del 24%. Carboidrati durante: linee guida di nutrizione sportiva (ACSM, IOC). */
function weightKg(){var w=Number(prof().weight);return w>=30&&w<=250?w:null}
function metBike(v){return v<16?4:v<19.3?6.8:v<22.5?8:v<25.7?10:v<30.6?12:15.8}
function burn(sp,km,up,sec){var kg=weightKg()||70,h=Math.max(1/60,sec/3600),climb=(kg+(sp==='bike'?9:0))*9.81*(up||0)/(.24*4184),base;
  if(sp==='run')base=kg*km*1.0;else base=metBike(km/h)*kg*h;var k=Math.round(base+climb);
  return {kcal:k,perKm:km>0?k/km:0,perH:k/h,kg:kg,assumed:!weightKg(),lo:Math.round(k*.8),hi:Math.round(k*1.2),
    rule:sp==='run'?'Circa 1 kcal per kg di peso per km, più il lavoro della salita.':'Dispendio dalla velocità media ('+nf(km/h,1)+' km/h, Compendium of Physical Activities) per peso e ore, più il lavoro della salita con bici di 9 kg.'}}
function carbPlan(sp,h){if(h<=1.05)return {lo:0,hi:0,g:0};var lo=h<=2.5?30:60,hi=h<=2.5?60:(sp==='run'?75:90),g=Math.round((lo+hi)/2*h/5)*5;return {lo:lo,hi:hi,g:g}}
function waterRate(t,hum){var r=t==null?.55:t<10?.4:t<18?.5:t<24?.6:t<28?.75:.9;if(t!=null&&t>=20&&hum>=70)r+=.1;return Math.min(1,r)}
/* p: {sport,km,up,sec,start} · sp: meteo dell'intervallo (o null) */
function kitFor(p,sp){var run=p.sport==='run',h=p.sec/3600,E=burn(p.sport,p.km,p.up,p.sec),C=carbPlan(p.sport,h),t=sp?sp.tmax:null,wr=waterRate(t,sp?sp.hum:0),wl=Math.round(wr*h*10)/10;
  var gels=0,bars=0,ban=0;if(C.g){if(run){gels=Math.ceil(C.g/25)}else{bars=Math.floor(C.g*.4/40);ban=C.g-bars*40>=50?1:0;gels=Math.max(0,Math.ceil((C.g-bars*40-ban*25)/25))}}
  var salt=h>=2||(t!=null&&t>=25&&h>=1),G=[],st=new Date(p.start),hr=st.getHours(),end=p.start+p.sec*1000;
  var drink=[];if(h<.75&&(t==null||t<22))drink.push('Acqua facoltativa per un\'uscita così breve: bevi prima di partire.');
    else drink.push('Acqua: circa '+nf(wl,1)+' litri ('+nf(wr,1)+' l all\'ora'+(t!=null?' con '+Math.round(t)+' °C percepiti':'')+')'+(run?'':' · '+Math.max(1,Math.ceil(wl/.75))+' borracce da 750 ml')+'.');
    if(wl>(run?.6:1.5))drink.push('Più di quanto si porta comodamente: pianifica una sosta a una fontanella o a un bar (vedi "Lungo il percorso").');
  G.push({t:'Da bere',items:drink});
  var eat=[];if(!C.g)eat.push('Durante non servono carboidrati: sotto l\'ora bastano le scorte del corpo.');
    else{eat.push('Carboidrati durante: '+C.lo+'–'+C.hi+' g all\'ora, in tutto circa '+C.g+' g (≈'+(C.g*4)+' kcal).');
      if(run)eat.push(gels+' gel da circa 25 g, uno ogni 30–40 minuti dopo i primi 45.');else eat.push([bars?bars+' barrett'+(bars===1?'a':'e')+' (≈40 g)':'',ban?'1 banana (≈25 g)':'',gels?gels+' gel (≈25 g)':''].filter(Boolean).join(' + ')+': inizia dopo 30–45 minuti, poco e spesso.');
      if(C.hi>60)eat.push('Oltre 60 g all\'ora solo se lo hai già provato in allenamento: servono prodotti con glucosio e fruttosio.')}
  G.push({t:'Da mangiare',items:eat});
  var sup=[];if(salt)sup.push('Sali minerali: bevanda isotonica o compresse, circa 300–600 mg di sodio per litro'+(t!=null&&t>=25?' (fa caldo e si suda molto)':'')+'.');
    else sup.push('Sali minerali: non necessari per questa durata e temperatura.');
    sup.push('Altri integratori non servono per uscite come questa. Per esigenze personali chiedi a un medico o a un nutrizionista.');G.push({t:'Sali e integratori',items:sup});
  var pre=[];if(hr<9)pre.push('Partenza presto: colazione leggera con carboidrati 1–2 ore prima (pane e marmellata, fette biscottate, banana).');else pre.push('Ultimo pasto con carboidrati 2–3 ore prima, poi uno spuntino leggero entro un\'ora dalla partenza.');
    if(h>=2.5)pre.push('Uscita lunga: cena ricca di carboidrati la sera prima.');G.push({t:'Prima di partire',items:pre});
  var wear=[];if(sp){if(t<5)wear.push('Freddo ('+Math.round(sp.tmin)+'–'+Math.round(t)+' °C percepiti): strati termici, guanti, '+(run?'cappello':'copriscarpe e scaldacollo')+'.');else if(t<12)wear.push('Fresco: maniche lunghe o manicotti e uno strato antivento.');else if(t>=27)wear.push('Caldo: tessuti leggeri e chiari, cappellino o bandana'+(run?'':' sotto il casco')+'.');
    if(sp.pp>=40||sp.pr>=1)wear.push('Probabilità di pioggia fino al '+Math.round(sp.pp)+'%: giacca impermeabile leggera'+(run?'':', parafanghi se li hai')+'.');
    if(sp.wind>=25)wear.push('Vento fino a '+Math.round(sp.wind)+' km/h: giacca antivento'+(run?'':'; occhio alle raffiche in discesa')+'.');
    if(sp.uv>=6||(t>=24&&!sp.dark))wear.push('Sole forte (UV '+(sp.uv>0?Math.round(sp.uv):'n.d.')+'): crema solare e occhiali'+(t>=28&&hr>=11&&hr<=16?'; se puoi evita le ore 12–16':'')+'.');
    if(sp.dark)wear.push('Parte al buio o finisce dopo il tramonto'+(sp.sunset?' (alle '+hhmm(sp.sunset)+')':'')+': '+(run?'luce frontale e indumenti riflettenti.':'luci anteriore e posteriore, giubbino riflettente.'))}
  else wear.push('Meteo non disponibile: controlla le previsioni prima di partire e porta uno strato in più.');
  G.push({t:'Abbigliamento',items:wear.length?wear:['Abbigliamento tecnico normale per la stagione.']});
  var gear=run?['Telefono carico e documento','Contanti o carta per una sosta']:['Casco','Camera d\'aria o kit riparazione, pompa o bomboletta, multiattrezzo','Telefono carico, documento, contanti o carta'];
  if(h>=2)gear.push(run?'Cintura o zainetto per acqua e gel':'Borsello sotto sella o tasche per il cibo');G.push({t:'Attrezzatura',items:gear});
  var after=h>=1.5?'Dopo: entro un\'ora carboidrati e 20–30 g di proteine (≈'+Math.round(E.kg*1)+'–'+Math.round(E.kg*1.2)+' g di carboidrati nelle prime ore se domani ti alleni ancora).':'Dopo: un pasto normale con carboidrati e proteine basta a recuperare.';
  return {E:E,C:C,water:{rate:wr,l:wl},gels:gels,bars:bars,ban:ban,salt:salt,groups:G,after:after,end:end}}
function energyHtml(E,C,compact){var pct=C&&C.g&&E.kcal?Math.round(C.g*4/E.kcal*100):0;
  return '<div class="kv"><div><b>'+nf(E.kcal)+'</b><span>kcal stimate ('+nf(E.lo)+'–'+nf(E.hi)+')</span></div><div><b>'+nf(E.perKm)+'</b><span>kcal per km</span></div>'+(compact?'':'<div><b>'+nf(E.perH)+'</b><span>kcal all\'ora</span></div><div><b>'+(C&&C.g?C.g+' g':'0 g')+'</b><span>carboidrati da assumere durante'+(pct?' (≈'+pct+'% del consumo)':'')+'</span></div>')+'</div>'+
    '<p class="muted" style="font-size:13px">'+esc(E.rule)+' Peso '+(E.assumed?'non indicato: uso 70 kg (impostalo dal Profilo).':nf(E.kg)+' kg.')+' Margine ±20%. '+(C&&C.g?'Durante si reintegra solo una parte del consumo: il resto con i pasti normali.':'')+'</p>'}

function kitSources(){var sp=S.sport,sg=suggestRoute().r,l=[];if(sg)l.push(['r:'+sg.id,'Proposta di oggi: '+sg.name]);myRoutes(sp).forEach(function(r){l.push(['r:'+r.id,'Tuo: '+r.name])});
  famousFor(sp).forEach(function(r){if(!sg||r.id!==sg.id)l.push(['r:'+r.id,r.name])});return l}
function kitInput(){var src=KIT.src||kitSources()[0][0],at=KIT.at,start=Date.now();if(at){var p=at.split(':'),d=new Date();d.setHours(Number(p[0]),Number(p[1]),0,0);if(d.getTime()<Date.now()-15*60e3)d.setDate(d.getDate()+1);start=d.getTime()}
  if(src.indexOf('h:')===0){var hh=Number(src.slice(2)),lv=prof().level,km=S.sport==='run'?hh*3600/REF.run[lv]:hh*REF.bike[lv];return {sport:S.sport,km:km,up:0,sec:hh*3600,start:start,label:dur(hh*3600)+' in piano',ll:wxLoc().ll,where:wxLoc().name}}
  var r=famousById(src.slice(2))||suggestRoute().r;return {sport:r.sport,km:rKm(r),up:rUp(r),sec:estimate(r).sec,start:start,label:r.name,ll:r.wp[0],where:'partenza di '+r.name,route:r}}
function viewKit(){var srcs=kitSources(),cur=KIT.src||srcs[0][0],P=kitInput(),now=new Date(),def=KIT.at||(pad(now.getHours())+':'+pad(now.getMinutes()));

  '<header><p class="eye">Prepararsi · '+(S.sport==='run'?'Running':'Ciclismo')+'</p><h1 style="font-size:clamp(28px,8vw,34px);margin-top:4px">Cosa portare</h1><p class="muted" style="margin-top:6px">Calcolato da durata, distanza, salita, ora di partenza e meteo previsto lungo l\'uscita.</p></header>'+
  '<div class="card pad stack" style="gap:12px"><label class="fld"><span>Uscita</span><select class="inp" id="kitSrc"><optgroup label="Percorsi">'+srcs.map(function(s){return '<option value="'+s[0]+'"'+(cur===s[0]?' selected':'')+'>'+esc(s[1])+'</option>'}).join('')+'</optgroup>'+
    '<optgroup label="Solo durata, in piano">'+[1,1.5,2,3,4,5].map(function(h){return '<option value="h:'+h+'"'+(cur==='h:'+h?' selected':'')+'>'+dur(h*3600)+'</option>'}).join('')+'</optgroup></select></label>'+
    '<div class="row" style="gap:10px"><label class="fld grow"><span>Partenza</span><input class="inp" id="kitAt" type="time" value="'+def+'"></label><label class="fld grow"><span>Peso (kg)</span><input class="inp" id="kitKg" type="number" min="30" max="250" step="1" inputmode="numeric" value="'+(weightKg()||'')+'" placeholder="70"></label></div>'+
    '<p class="muted" style="font-size:13px">Il peso serve solo alle calorie e resta in questo browser.</p></div>'+
  '<div id="kitOut" aria-live="polite"><p class="muted">Carico il meteo…</p></div>'+
  '<p class="muted" style="font-size:13px">Indicazioni generali per adulti in salute, basate sulle linee guida di nutrizione sportiva (ACSM, IOC). Non sono un consiglio medico: con patologie, gravidanza, diabete o diete particolari chiedi a un medico o a un nutrizionista. Meteo: Open-Meteo.</p>'}
function afterKit(){paintKit()}
function paintKit(){var P=kitInput(),box=$('#kitOut');if(!box)return;var key=JSON.stringify([P.label,P.start,weightKg()]);box.dataset.k=key;
  var draw=function(d,err){if(box.dataset.k!==key)return;var sp=d?wxSpan(d,P.start,P.start+P.sec*1000):null,K=kitFor(P,sp);
    box.innerHTML='<section class="sect"><h2>'+esc(P.label)+'</h2><p class="sub">'+rkm1(P.km)+' km · '+Math.round(P.up)+' m di salita · '+dur(P.sec)+' · dalle '+hhmm(P.start)+' alle '+hhmm(K.end)+'</p>'+
      (sp?'<div class="card pad row wxline">'+wxIcon(sp.code,sp.dark?0:1,30)+'<div class="grow"><b>'+wxLabel(sp.code)+' · '+Math.round(sp.tmin)+'–'+Math.round(sp.tmax)+' °C percepiti</b><div class="muted" style="font-size:14px">Pioggia '+(sp.pp>=0?Math.round(sp.pp)+'%':'n.d.')+' · vento fino a '+Math.round(sp.wind)+' km/h · '+esc(P.where)+'</div></div></div>'
        :banner('info',err?'Meteo non disponibile ('+esc(err)+'): l\'elenco non tiene conto di temperatura e pioggia.':'Previsione non disponibile per quell\'ora (oltre 2 giorni): l\'elenco non tiene conto del meteo.'))+'</section>'+
      '<section class="sect"><h2>Energia</h2>'+energyHtml(K.E,K.C)+'</section>'+
      '<section class="sect"><h2>L\'occorrente</h2><div class="card pad stack kit" style="gap:14px">'+K.groups.map(function(g,gi){return '<div><p class="eye">'+g.t+'</p><ul>'+g.items.map(function(it,ii){return '<li><label><input type="checkbox" aria-label="Fatto"><span>'+esc(it)+'</span></label></li>'}).join('')+'</ul></div>'}).join('')+
      '<p style="font-size:15px">'+esc(K.after)+'</p></div></section>'};
  loadWx(P.ll).then(function(d){draw(d)}).catch(function(e){draw(null,e&&e.name==='AbortError'?'tempo scaduto':'servizio non raggiungibile')})}
document.addEventListener('change',function(e){var t=e.target;if(t.id==='kitSrc'){KIT.src=t.value;paintKit()}else if(t.id==='kitAt'){KIT.at=t.value||null;paintKit()}
  else if(t.id==='kitKg'||t.id==='profKg'){var v=Number(t.value);if(t.value===''){saveProf({weight:null});if(t.id==='kitKg')paintKit();return}if(!(v>=30&&v<=250)){toast('Peso tra 30 e 250 kg');return}saveProf({weight:Math.round(v)});toast('Peso salvato in questo browser');if(t.id==='kitKg')paintKit()}
  else if(t.name==='pprof'&&S.view==='plan'){PLAN.prof=t.value;planCompute()}});

    if(add){var ll=[Math.round(P.ll[0]*1e5)/1e5,Math.round(P.ll[1]*1e5)/1e5];WPN[wpKey(ll)]=P.name;planAdd(ll);if(PLAN.map&&PLAN.wp.length===1)PLAN.map.setView(ll,13);toast('Tappa aggiunta: '+P.name);var qi=$('#planQ');if(qi)qi.value='';return}
    if(PLAN.map){if(P.bb)PLAN.map.fit(P.bb,20);else PLAN.map.setView(P.ll,13);if(PLAN.map.z<11)PLAN.map.setView(PLAN.map.c,11)}toast(P.name)}).catch(function(){toast('Ricerca luoghi non disponibile in questo momento')})}
document.addEventListener('input',function(e){if(e.target.id==='planName')PLAN.name=e.target.value});
document.addEventListener('submit',function(e){if(e.target.id!=='planFind')return;e.preventDefault();planFind(false)});

function actEnergy(a){var E=burn(a.sport,a.distanceKm,a.ascentM||0,a.movingSec),h=a.movingSec/3600,C=carbPlan(a.sport,h);

/* ================= PERCORSO CONSIGLIATO (automatico) =================
   Non è intelligenza artificiale: regole dichiarate. Si provano anelli in più direzioni attorno alla partenza,
   ognuno calcolato da BRouter con il profilo che preferisce ciclabili, strade secondarie e sterrati percorribili
   (bici: "trekking"; corsa: "hiking-mountain"). Poi si misura su che strade passa davvero ogni anello (tag OpenStreetMap)
   e si tengono i migliori: più ciclabili, strade tranquille e sterrati, meno strade trafficate, distanza vicina a quella chiesta. */
var AUTO={st:'',cands:[],show:-1,err:'',open:false},AUTOPREF=LS.get('autoPref',{km:{bike:40,run:8},dir:'any',surf:'mix',shape:'loop'});
function llOff(ll,brg,km){var b=brg*Math.PI/180;return [Math.round((ll[0]+km/111.32*Math.cos(b))*1e5)/1e5,Math.round((ll[1]+km/(111.32*Math.cos(ll[0]*Math.PI/180))*Math.sin(b))*1e5)/1e5]}
function loopWps(st,brg,R){var c=llOff(st,brg,R),back=(brg+180)%360;return [st,llOff(c,back+90,R),llOff(c,brg,R),llOff(c,back-90,R),st]}
function autoProf(sp,surf){return sp==='run'?(surf==='paved'?'shortest':'hiking-mountain'):(surf==='paved'?'safety':'trekking')}
function brgOf(a,b){var y=(b[1]-a[1])*Math.cos((a[0]+b[0])/2*Math.PI/180),x=b[0]-a[0];return (Math.atan2(y,x)*180/Math.PI+360)%360}
/* quota del tracciato che ripassa su strade già fatte (anelli "strani"): celle di circa 40 m */
function overlapShare(g){var seen={},rep=0,tot=0;for(var i=1;i<g.pts.length;i++){var p=g.pts[i],k=Math.round(p[0]/4e-4)+'_'+Math.round(p[1]/5.5e-4),d=g.dist[i]-g.dist[i-1];tot+=d;

  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){var mt='',ty=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];for(var i=0;i<ty.length;i++)if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(ty[i])){mt=ty[i];break}
    var mr;try{mr=new MediaRecorder(st,mt?{mimeType:mt}:undefined)}catch(e){st.getTracks().forEach(function(t){t.stop()});toast('Registrazione audio non disponibile');return}
    var R={mr:mr,st:st,chunks:[],t0:Date.now(),cancel:false};REC=R;mr.ondataavailable=function(e){if(e.data&&e.data.size)R.chunks.push(e.data)};
    mr.onstop=function(){st.getTracks().forEach(function(t){t.stop()});clearInterval(R.iv);REC=null;paintRec();if(R.cancel)return;var type=(mr.mimeType||mt||'audio/webm').split(';')[0],blob=new Blob(R.chunks,{type:type}),secs=(Date.now()-R.t0)/1000;
      if(secs<1||!blob.size){toast('Messaggio troppo corto');return}onDone(blob,secs)};
    mr.start(250);R.iv=setInterval(function(){if(Date.now()-R.t0>=120000){toast('Massimo 2 minuti');recStop(false)}else paintRec()},250);paintRec()})
  .catch(function(e){toast(e&&e.name==='NotAllowedError'?'Microfono non autorizzato: puoi permetterlo nelle impostazioni del browser':'Microfono non disponibile')})}

  var t=bar.querySelector('.rt');if(t){t.textContent=clock(s);return}
  bar.innerHTML='<span class="rdot" aria-hidden="true"></span><span class="grow">Registrazione <b class="rt num">'+clock(s)+'</b> · massimo 2 min</span><button type="button" class="btn btn-sec sm" data-act="recCancel">Annulla</button><button type="button" class="btn btn-ink sm" data-act="recSend">Invia</button>'}

    [[trace,Lt],[lead,Ll],[mp,Lm]].forEach(function(p){p[0].style.strokeDasharray=p[1]+' '+(p[1]+20);p[0].style.strokeDashoffset=p[1]});

      if(REDUCED){setTimeout(function(){if(ended)return;var f=el.animate?el.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'}):null;if(f)f.onfinish=function(){finish(false)};else finish(false)},450);return}
      A(sym,[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:240,easing:'ease-out',fill:'both'});A(wm,[{opacity:0},{opacity:1}],{duration:240,fill:'both'});
      setTimeout(function(){fly(380)},360);return}
    var E='cubic-bezier(.45,.05,.25,1)';
    A(lead,[{strokeDashoffset:Ll},{strokeDashoffset:0,offset:.6},{strokeDashoffset:-Ll}],{duration:950,easing:'cubic-bezier(.4,0,.3,1)',fill:'both'});
    A(trace,[{strokeDashoffset:Lt},{strokeDashoffset:0}],{duration:720,delay:540,easing:E,fill:'both'});

    revealApp(d);

      A(sym,[{transform:'none'},{transform:'translate('+dx+'px,'+dy+'px) scale('+(to.width/from.width)+')'}],{duration:d,easing:'cubic-bezier(.6,0,.2,1)',fill:'forwards'})}
    if(wf&&wt&&wt.width>0){tw.style.visibility='hidden';wm.style.transformOrigin='left top';A(wm,[{transform:'none'},{transform:'translate('+(wt.left-wf.left)+'px,'+(wt.top-wf.top)+'px) scale('+(wt.width/wf.width)+')'}],{duration:d,easing:'cubic-bezier(.6,0,.2,1)',fill:'forwards'})}
    else A(wm,[{opacity:1},{opacity:0}],{duration:d*.6,fill:'forwards'});

    A(el,[{backgroundColor:'rgba(245,242,235,1)'},{backgroundColor:'rgba(245,242,235,0)'}],{duration:d*.8,delay:d*.25,easing:'ease-in',fill:'forwards'});
    setTimeout(function(){finish(false)},d+40)}}
