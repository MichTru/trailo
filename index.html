<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="assets/trailo-simbolo.png">
<link rel="preload" as="image" href="assets/trailo-simbolo.png"><link rel="preload" as="image" href="assets/trailo-wordmark.png">
<title>Trailo 2.0 · prototipo</title>
<meta name="theme-color" content="#F5F2EB">
<meta name="description" content="Prototipo navigabile di Trailo 2.0: percorsi, registrazione e progressi per ciclismo e running.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
/* TRAILO 2.0 · prototipo rev. 3
   Tre esperienze, un marchio:
   - Home e Progressi su carta chiara (il wordmark originale è nero: resta fedele senza inversioni)
   - Percorsi costruito attorno a immagini grandi e alla carta del territorio
   - Attività su fondo notte, solo numeri e stato */
:root{
  --paper:#F5F2EB; --paper2:#ECE6DA; --card:#FFFFFF; --hair:rgba(20,26,34,.12); --hair2:rgba(20,26,34,.2);
  --ink:#141A22; --ink2:#3E4652; --ink3:#5C6370;
  --tq:#00CFC8; --tq-t:#00706C; --blue:#0789B4; --blue-t:#06688A; --or:#FF6A2E; --or-t:#B3430F;
  --ok:#1D7A52; --warn:#9A6408; --crit:#B4380C;
  --night:#05090F; --m1:#0D141E; --m2:#162130; --mfg:#F2F5F8; --mfg2:#A9B5C4;
  --acc:var(--tq); --acc-t:var(--tq-t); --acc-ink:#03201F; --acc-soft:rgba(0,207,200,.16);
  --display:"Sora",ui-sans-serif,system-ui,sans-serif; --body:"Manrope",ui-sans-serif,system-ui,sans-serif; --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --r-s:12px; --r-m:18px; --r-l:28px; --nav-h:66px;
  --gx:max(16px,env(safe-area-inset-left,0px));
  color-scheme:light;
}
body.run{--acc:var(--or);--acc-t:var(--or-t);--acc-ink:#2A0E02;--acc-soft:rgba(255,106,46,.14)}
html,body{background:var(--paper);color:var(--ink)}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance;line-height:1.12;font-weight:800}
p{margin:0}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eye{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink3)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--paper2);color:var(--ink2);white-space:nowrap}
.tag.sim{background:#FFF1C9;color:#6B4A00}.tag.gps{background:#D9F2E6;color:#0F5A3A}.tag.demo{background:#E7E3F7;color:#433A79}
.tag.na{background:var(--paper2);color:var(--ink3)}

/* pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 20px;border-radius:16px;font-weight:800;font-size:16px;text-align:center}
.btn-pri{background:var(--acc);color:var(--acc-ink)}
.btn-pri.xl{min-height:62px;font-size:18px;border-radius:20px;width:100%}
.btn-ink{background:var(--ink);color:#fff}
.btn-sec{background:var(--card);color:var(--ink);border:1.5px solid var(--hair2)}
.btn-ghost{color:var(--ink2);min-height:44px;font-weight:800;padding:0 6px}
.btn-danger{background:#FBE3D9;color:#8A2A06}
.link{color:var(--acc-t);font-weight:800;text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--hair);flex:none}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 15px;border-radius:999px;background:var(--card);border:1.5px solid var(--hair2);font-size:14px;font-weight:800;white-space:nowrap;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--gx));padding:2px var(--gx)}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--paper2);gap:4px}
.seg button{flex:1;min-height:44px;border-radius:10px;font-weight:800;font-size:14px;color:var(--ink2);padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,34,.15)}

/* struttura */
.shell{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(8px + env(safe-area-inset-top,0px)) var(--gx) 8px;background:rgba(245,242,235,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:8px;min-height:44px}
.brand .sym{height:30px;width:auto;display:block}
.brand .wm{height:17px;width:auto;display:block}
body[data-exp="explore"] .top{position:absolute;left:0;right:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
body[data-exp="explore"] .top .brand{background:rgba(245,242,235,.94);padding:4px 12px 4px 8px;border-radius:999px}
body[data-exp="explore"] .top .brand .wm{display:none}
.tg{display:flex;padding:3px;border-radius:999px;background:var(--card);border:1px solid var(--hair)}
.tg button{min-width:48px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--ink3)}
.tg button[aria-pressed="true"]{background:var(--ink);color:#fff}
main{padding:4px var(--gx) calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
body[data-exp="explore"] main{padding-top:0}
.view{display:flex;flex-direction:column;gap:20px}
.view.enter{animation:vin .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-m)}
.pad{padding:16px}
.empty{padding:20px;border:1.5px dashed var(--hair2);border-radius:var(--r-m);color:var(--ink2);font-size:15px;background:rgba(255,255,255,.5)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:600;line-height:1.4}
.banner.demo{background:#ECE8FA;color:#2F2766}.banner.sim{background:#FFF4D6;color:#5A3E00}.banner.info{background:#E3F1F6;color:#0B4258}.banner.err{background:#FCE4DA;color:#7A2405}
.bar{height:10px;border-radius:10px;background:var(--paper2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:10px}
.ask{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r-m);background:var(--ink);color:#fff;width:100%;text-align:left;min-height:60px}
.ask svg{flex:none}
.ask small{display:block;color:#C5CCD6;font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));z-index:120;background:var(--ink);color:#fff;font-weight:800;padding:12px 18px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.top{bottom:calc(108px + env(safe-area-inset-bottom,0px))}

/* barra di navigazione con incavo liquido (dalla GIF di riferimento):
   la voce attiva sale in una sfera scura, la barra si piega sotto di lei e l'incavo scorre verso la voce scelta */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.nav .in{position:relative;pointer-events:auto;width:100%;max-width:560px;height:calc(66px + env(safe-area-inset-bottom,0px))}
.tb-bg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 -6px 14px rgba(20,26,34,.13));pointer-events:none}
.tb-bg path{fill:#fff}
.tb-items{position:absolute;left:max(0px,env(safe-area-inset-left,0px));right:max(0px,env(safe-area-inset-right,0px));top:0;height:66px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tb-items button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;padding-bottom:9px;min-height:66px;color:var(--ink3);font-size:12px;font-weight:800}
.tb-items button>svg{transition:opacity .2s,transform .3s}
.tb-items button[aria-current="page"]{color:var(--ink)}
.tb-items button.on>svg{opacity:0;transform:translateY(10px)}
.tb-items .start .c{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink)}
.tb-ball{position:absolute;left:0;top:0;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--acc);display:grid;place-items:center;
  box-shadow:0 10px 18px -8px rgba(20,26,34,.65);pointer-events:none;will-change:transform,opacity;z-index:2}
.tb-ball svg{width:24px;height:24px;display:block}

/* ===== HOME ===== */
.h-hello h1{font-size:clamp(30px,8.6vw,40px)}
.h-hello p{font-size:17px;color:var(--ink2);max-width:36ch;margin-top:8px}
.pcard{position:relative;display:block;border-radius:var(--r-l);overflow:hidden;background:#222;color:#fff;text-align:left;width:100%;aspect-ratio:4/3.1;min-height:240px}
.pcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcard .scr{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,9,15,0) 35%,rgba(5,9,15,.78) 100%)}
.pcard .txt{position:absolute;left:0;right:0;bottom:0;padding:18px;display:flex;flex-direction:column;gap:4px}
.pcard .txt h2,.pcard .txt h3{color:#fff;font-size:24px}
.pcard .meta{font-size:14px;font-weight:700;color:#EEF1F4}
.pcard .why{position:absolute;top:12px;left:12px;font-size:12px;font-weight:800;background:rgba(245,242,235,.94);color:var(--ink);padding:5px 10px;border-radius:999px}
.ill{position:absolute;right:10px;top:10px;font-size:11px;font-weight:800;color:#fff;background:rgba(5,9,15,.55);padding:4px 8px;border-radius:999px}
.steps3{display:grid;gap:12px}
.steps3 .s{display:flex;gap:12px;align-items:flex-start}
.steps3 .n{width:30px;height:30px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;font-family:var(--display)}
.wk{display:flex;flex-direction:column;gap:10px}
.wk .big{font-size:40px;font-weight:800;line-height:1}
.lastact{display:flex;align-items:center;gap:14px;width:100%;text-align:left}

/* ===== PERCORSI (Explore) ===== */
.ex-hero{position:relative;margin:0 calc(-1*var(--gx));height:min(68vh,560px);min-height:400px;overflow:hidden;background:#3a4a5a;color:#fff}
.ex-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ex-hero .scr{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,9,15,.25) 0%,rgba(5,9,15,0) 30%,rgba(5,9,15,.72) 100%)}
.ex-hero .txt{position:absolute;left:var(--gx);right:var(--gx);bottom:84px;display:flex;flex-direction:column;gap:8px}
.ex-hero h1{font-size:clamp(36px,11vw,54px);color:#fff;line-height:1.02}
.ex-hero .eye{color:#F4F1EA}
.ex-hero p{font-size:17px;font-weight:600;color:#F4F1EA;max-width:30ch}
.ex-search{position:relative;margin:-64px 0 0;z-index:2}
.ex-search label{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 16px;border-radius:18px;background:var(--card);box-shadow:0 10px 30px rgba(5,9,15,.18)}
.ex-search input{flex:1;min-width:0;background:none;border:0;font-size:16px;outline:none;min-height:52px}
.fgroup{display:flex;flex-direction:column;gap:8px}
.fgroup .eye{margin-left:2px}
.rlist{display:grid;gap:18px}
.rcard{display:block;width:100%;text-align:left;background:var(--card);border-radius:var(--r-l);overflow:hidden;border:1px solid var(--hair)}
.rcard figure{margin:0;position:relative;aspect-ratio:16/9;background:#c9c2b4}
.rcard figure img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rcard .diff{position:absolute;left:12px;top:12px}
.rcard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.rcard h3{font-size:21px}
.stats4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.stats4>span{display:flex;flex-direction:column;gap:1px;min-width:0}
.stats4 b{font-family:var(--display);font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats4>span>span{font-size:12px;color:var(--ink3);font-weight:700}
.dtag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:rgba(245,242,235,.95);color:var(--ink)}
.dtag i{width:8px;height:8px;border-radius:50%}
.rd-hero{position:relative;margin:0 calc(-1*var(--gx));height:min(52vh,440px);min-height:300px;overflow:hidden;background:#3a4a5a}
.rd-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rd-hero .scr{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,9,15,.35) 0%,rgba(5,9,15,0) 35%)}
.rd-hero .back{position:absolute;left:var(--gx);top:calc(66px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 10px;border-radius:999px;background:rgba(245,242,235,.95);color:var(--ink);font-weight:800}
.rd-hero .ill{top:auto;bottom:40px}
.rd-sheet{position:relative;margin:-28px calc(-1*var(--gx)) 0;padding:22px var(--gx) 0;background:var(--paper);border-radius:28px 28px 0 0;display:flex;flex-direction:column;gap:18px}
.rd-sheet h1{font-size:clamp(28px,8vw,36px)}
.map{position:relative;border-radius:var(--r-l);overflow:hidden;background:#EFE8D8;border:1px solid var(--hair);aspect-ratio:4/3}
.map canvas,.map>svg{position:absolute;inset:0;width:100%;height:100%}
.map .lab{position:absolute;left:10px;bottom:10px;right:10px;font-size:12px;color:var(--ink);font-weight:700;background:rgba(255,255,255,.88);padding:5px 9px;border-radius:9px;width:max-content;max-width:calc(100% - 20px)}
.map .attr{position:absolute;right:0;bottom:0;font-size:11px;background:rgba(255,255,255,.85);padding:2px 6px;color:#333}
.map .attr a{color:#0B4F6C}
.map .tiles{position:absolute;inset:0;overflow:hidden}
.map .tiles img{position:absolute;width:256px;height:256px;max-width:none;user-select:none}
.map .mstate{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ink2);text-align:center;padding:20px}
.routepath{fill:none;stroke-linecap:round;stroke-linejoin:round}
.prof{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.prof svg{display:block;width:100%;height:auto;overflow:visible}
.prof svg:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.est{font-size:14px;color:var(--ink2);background:var(--paper2);padding:10px 12px;border-radius:12px}

/* ===== ATTIVITÀ (Move) ===== */
.move{position:fixed;inset:0;z-index:60;background:var(--night);color:var(--mfg);display:flex;flex-direction:column;color-scheme:dark}
.move .in{max-width:620px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.mv-hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;min-height:36px;padding:0 12px;border-radius:999px;background:var(--m1);font-size:14px;font-weight:800;color:var(--mfg)}
.pill i{width:10px;height:10px;border-radius:50%;flex:none}
.pill.simb{background:#3A2E05;color:#FFE08A}
.mv-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:12px;overscroll-behavior:contain}
.mv-big{text-align:center;padding:4px 0 2px}
.mv-big .l{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mfg2)}
.mv-big .v{font-size:clamp(64px,24vw,124px);font-weight:800;line-height:.98;color:var(--acc)}
.mv-big .u{font-size:16px;color:var(--mfg2);font-weight:700}
.mv-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mt{position:relative;background:var(--m1);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:12px 14px;text-align:left;width:100%;min-height:76px;color:var(--mfg)}
.mt .num{font-size:clamp(26px,8.5vw,38px);font-weight:800;line-height:1.08;display:block}
.mt .lbl{font-size:13px;color:var(--mfg2);font-weight:800;letter-spacing:.02em;display:block}
.mt.na .num{font-size:20px;color:var(--mfg2)}
.mv-note{text-align:center;font-size:14px;color:var(--mfg2);min-height:20px}
.mv-note.warn{color:#FFD27A;font-weight:700}
.mv-ctrl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));background:var(--night);border-top:1px solid rgba(255,255,255,.06)}
.mv-ctrl .btn{min-height:72px;font-size:20px;border-radius:22px}
.btn-pause{background:var(--m2);color:var(--mfg)}
.btn-stop{background:#2B1714;color:#FFB4A8}
.btn-stop.armed{background:#FF7A6B;color:#1B0503}
.move .btn-pri{color:var(--acc-ink)}
@media (max-height:620px){.mv-big .v{font-size:clamp(56px,18vw,88px)}.mt{min-height:64px;padding:8px 12px}.mt .num{font-size:26px}.mv-ctrl .btn{min-height:60px}}
@media (orientation:landscape) and (max-height:520px){
  .move .in{max-width:980px}
  .mv-body{display:grid;grid-template-columns:1fr 1.2fr;align-items:start;column-gap:16px}
  .mv-big{grid-row:1/3;align-self:center}.mv-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mv-big .v{font-size:min(84px,22vh)}.mt{min-height:58px;padding:8px 12px}.mt .num{font-size:24px}
  .mv-ctrl{padding-top:8px}.mv-ctrl .btn{min-height:52px;font-size:18px}
}

/* ===== PROGRESSI (Evolve) ===== */
body[data-exp="evolve"]{--paper:#F7F5F0}
.ev-head .eye{color:var(--acc-t)}
.ev-head h1,.serif{font-family:var(--serif);font-weight:500;letter-spacing:-.01em}
.ev-head h1{font-size:clamp(34px,9.5vw,46px);line-height:1.05}
.ev-hero{padding:22px 20px;border-radius:var(--r-l);background:var(--card);border:1px solid var(--hair);display:flex;flex-direction:column;gap:12px}
.ev-hero .big{font-size:clamp(48px,15vw,68px);font-weight:700;line-height:.95}
.ev-hero .of{font-size:18px;color:var(--ink3);font-weight:700}
.sect{display:flex;flex-direction:column;gap:12px}
.sect>h2{font-size:20px}
body[data-exp="evolve"] .sect h2{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:-.01em}
.sect>.sub{font-size:14px;color:var(--ink3);margin-top:-6px}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding:0 0 0;position:relative}
.bars .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink3);pointer-events:none}
